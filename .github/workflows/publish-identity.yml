# Publishes the Evantra Identity packages to npm via Trusted Publishing (OIDC).
#
# No npm token or secret is stored anywhere. GitHub mints a short-lived OIDC
# token that npm verifies against the Trusted Publisher configured on each
# package, so there is no long-lived credential to leak or rotate.
#
# Release by pushing a tag:
#   git tag identity-v0.1.0
#   git push origin identity-v0.1.0
#
# The version in the tag is NOT trusted; the version in each package.json is
# what gets published. The tag only decides *when*.
#
# One-time setup (see evantra/docs/publishing.md):
#   npmjs.com -> each package -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: Debuck1718
#     Repository:           evantradebuckman
#     Workflow filename:    publish-identity.yml
#     Environment:          (leave blank)

name: Publish Identity

on:
  push:
    tags:
      - "identity-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack only, do not publish"
        type: boolean
        default: true

# Least privilege: OIDC minting needs id-token, and npm provenance needs it too.
permissions:
  contents: read
  id-token: write

# Never let two releases race each other.
concurrency:
  group: publish-identity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Do NOT pass `version` here. pnpm/action-setup refuses to run when the
      # action's version conflicts with the `packageManager` field in
      # package.json ("Multiple versions of pnpm specified"). It reads that
      # field instead, so the repo stays the single source of truth. The root
      # and evantra/ package.json files must therefore agree.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships an npm new enough for Trusted Publishing. Older npm
          # silently ignores the OIDC exchange and falls back to token auth.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # npm performs the OIDC exchange, so pin it explicitly rather than
      # relying on whatever the runner image happens to bundle.
      - name: Pin npm
        run: npm install -g npm@latest

      # The pnpm workspace lives in evantra/, not the repository root.
      - name: Install dependencies
        working-directory: evantra
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: evantra
        run: pnpm typecheck

      - name: Build
        working-directory: evantra
        run: |
          pnpm --filter @evantra-identity/sdk build
          pnpm --filter @evantra-identity/react build

      - name: Show tarball contents
        working-directory: evantra
        run: |
          pnpm --filter @evantra-identity/sdk pack --dry-run
          pnpm --filter @evantra-identity/react pack --dry-run

      # npm reads package.json for the version. --provenance is safe here
      # (unlike a local publish) because GitHub provides an OIDC provider.
      # publishConfig.access is already "public", so no --access flag.
      - name: Publish @evantra-identity/sdk
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: evantra/packages/sdk
        run: npm publish --provenance

      - name: Publish @evantra-identity/react
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: evantra/packages/identity-react
        run: npm publish --provenance

      # `npm view <pkg> version` exits 0 even when it returns a stale version,
      # so printing it proves nothing. Assert the published version equals the
      # one in package.json, and fail the job otherwise. Without this, a publish
      # that quietly does nothing still produces a green run.
      - name: Verify on the registry
        working-directory: evantra
        run: |
          set -euo pipefail
          check() {
            local pkg="$1" dir="$2"
            local want published attempts=0
            want=$(node -p "require('./$dir/package.json').version")
            while [ "$attempts" -lt 10 ]; do
              published=$(npm view "$pkg" version 2>/dev/null || echo missing)
              if [ "$published" = "$want" ]; then
                echo "OK  $pkg@$published"
                return 0
              fi
              attempts=$((attempts + 1))
              echo "waiting for $pkg (want $want, registry has $published) [$attempts/10]"
              sleep 15
            done
            echo "::error::$pkg published $published but package.json says $want"
            return 1
          }
          failed=0
          check @evantra-identity/sdk packages/sdk || failed=1
          check @evantra-identity/react packages/identity-react || failed=1
          exit $failed
