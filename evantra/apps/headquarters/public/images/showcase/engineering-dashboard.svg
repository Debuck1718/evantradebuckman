      <text x="66" y="282">Autonomous Units</text>
      <circle cx="46" cy="333" r="7" fill="none" stroke="#7fb0a8" stroke-width="2"/>
      <text x="66" y="338">Edge Nodes</text>
      <circle cx="46" cy="389" r="7" fill="none" stroke="#7fb0a8" stroke-width="2"/>
      <text x="66" y="394">IoT Sensors</text>
      <circle cx="46" cy="445" r="7" fill="none" stroke="#7fb0a8" stroke-width="2"/>
