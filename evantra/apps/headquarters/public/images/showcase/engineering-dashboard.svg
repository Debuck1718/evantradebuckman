    <rect x="20" y="142" width="4" height="46" rx="2" fill="url(#teal)"/>
    <circle cx="46" cy="165" r="7" fill="none" stroke="#5ff0d4" stroke-width="2"/>
    <text x="66" y="170" fill="#ffffff" font-weight="600">Control Room</text>

