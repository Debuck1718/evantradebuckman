    </g>

    <g transform="translate(586,10)" filter="url(#card)">
      <rect width="558" height="270" rx="20" fill="#0a302e" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="26" y="42" fill="#ffffff" font-size="16" font-weight="700">Live Events</text>
      <g font-size="12.5">
        <circle cx="34" cy="82" r="5" fill="#5ff0d4"/>
        <text x="52" y="86" fill="#d6f4ef">Unit AX-118 entered Zone 3</text>
        <text x="52" y="103" fill="#5fa79c" font-size="11">Autonomous navigation · just now</text>
        <line x1="34" y1="92" x2="34" y2="122" stroke="#ffffff" stroke-opacity="0.1"/>

        <circle cx="34" cy="132" r="5" fill="#e6b24a"/>
        <text x="52" y="136" fill="#d6f4ef">Predictive maintenance · Unit RB-42</text>
        <text x="52" y="153" fill="#5fa79c" font-size="11">Bearing wear detected · 6m ago</text>
        <line x1="34" y1="142" x2="34" y2="172" stroke="#ffffff" stroke-opacity="0.1"/>

        <circle cx="34" cy="182" r="5" fill="#4aa3f0"/>
        <text x="52" y="186" fill="#d6f4ef">Edge model OTA update deployed</text>
        <text x="52" y="203" fill="#5fa79c" font-size="11">Fleet-wide · 24m ago</text>
        <line x1="34" y1="192" x2="34" y2="222" stroke="#ffffff" stroke-opacity="0.1"/>

        <circle cx="34" cy="232" r="5" fill="#5ff0d4"/>
        <text x="52" y="236" fill="#d6f4ef">Digital twin sync completed</text>
        <text x="52" y="253" fill="#5fa79c" font-size="11">Plant model v9 · 1h ago</text>
      </g>
    </g>
