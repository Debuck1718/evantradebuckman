    <g stroke="#04211f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="11" y="15" width="16" height="12" rx="2"/>
      <path d="M15 15 v-3 h8 v3 M19 27 v4 M11 31 h16"/>
    </g>
    <text x="52" y="18" fill="#ffffff" font-size="17" font-weight="700" letter-spacing="0.5">Evantra</text>
