      <circle r="76" fill="none" stroke="url(#gold)" stroke-width="20" stroke-dasharray="48 478" stroke-dashoffset="-382" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="-2" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">94%</text>
      <text x="0" y="22" text-anchor="middle" fill="#7fb0a8" font-size="10.5" letter-spacing="1.5">NOMINAL</text>
