    <text x="66" y="561">Telemetry</text>
    <circle cx="46" cy="612" r="7" fill="none" stroke="#7fb0a8" stroke-width="2"/>
    <text x="66" y="617">Predictive Maint.</text>
    <circle cx="46" cy="668" r="7" fill="none" stroke="#7fb0a8" stroke-width="2"/>
    <text x="66" y="673">Safety Systems</text>
  </g>

  <rect x="20" y="878" width="228" height="86" rx="14" fill="#0b3b38"/>
  <circle cx="44" cy="906" r="5" fill="#5ff0d4"/>
  <text x="60" y="911" fill="#d6f4ef" font-size="12.5" font-weight="600">Fleet operational</text>
  <text x="44" y="936" fill="#7fb0a8" font-size="11.5">312 units · 0 critical</text>
  <rect x="44" y="946" width="180" height="6" rx="3" fill="#12514c"/>
  <rect x="44" y="946" width="172" height="6" rx="3" fill="url(#teal)"/>

