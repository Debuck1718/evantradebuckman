          <text x="520" y="194" text-anchor="end" fill="#7fb0a8">64 units</text>
          <rect x="26" y="206" width="494" height="8" rx="4" fill="#12514c"/>
          <rect x="26" y="206" width="200" height="8" rx="4" fill="#5ff0d4"/>

          <text x="26" y="250" fill="#d6f4ef">Research Campus</text>
          <text x="520" y="250" text-anchor="end" fill="#7fb0a8">24 units</text>
        </g>
