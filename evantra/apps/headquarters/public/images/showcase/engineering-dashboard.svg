      <text x="372" y="155" fill="#7fb0a8">292</text>
      <circle cx="252" cy="184" r="5" fill="#e6b24a"/>
      <text x="268" y="189" fill="#d6f4ef">Maintenance</text>
      <text x="378" y="189" fill="#7fb0a8">14</text>
      <circle cx="252" cy="218" r="5" fill="#4aa3f0"/>
      <text x="268" y="223" fill="#d6f4ef">Charging</text>
      <text x="378" y="223" fill="#7fb0a8">6</text>
      <circle cx="252" cy="252" r="5" fill="#ef6f6f"/>
      <text x="268" y="257" fill="#d6f4ef">Offline</text>
