  <text x="308" y="40" fill="#ffffff" font-size="19" font-weight="700">Autonomous Systems Control</text>
  <text x="308" y="63" fill="#7fb0a8" font-size="12.5">Robotics, mobility &amp; connected infrastructure telemetry</text>

