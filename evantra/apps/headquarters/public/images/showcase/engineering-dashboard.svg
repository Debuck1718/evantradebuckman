    <!-- secondary dashed gold -->
    <path d="M28 276 C110 268 160 250 220 246 C300 240 360 214 430 210 C510 204 570 182 650 170 C720 160 770 150 808 142" fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="8 8"/>

    <circle cx="680" cy="140" r="5.5" fill="#0a302e" stroke="#5ff0d4" stroke-width="3"/>

